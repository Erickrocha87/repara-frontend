include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated code and build/platform directories. Flutter 3.47's
    # AnalysisOptionsMigration requires these entries; they do not change
    # code lint rules.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "android/**"
    - "ios/**"
    - "web/**"
    - "windows/**"
    - "macos/**"
    - "linux/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Keep analyzer findings visible; do not downgrade errors to warnings.
    invalid_assignment: error
    missing_return: error
    dead_code: warning

linter:
  rules:
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    omit_local_variable_types: true
    prefer_const_constructors: true
    prefer_final_fields: true
    prefer_final_locals: true
    unawaited_futures: true